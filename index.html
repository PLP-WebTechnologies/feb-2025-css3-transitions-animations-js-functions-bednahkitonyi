<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions and Animations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="animateButton">Click me to animate</button>
        <img id="animatedImage" src="Chill.jpg" alt="Placeholder Image">
    </div>

    <div class="preferences">
        <label for="durationSelect">Select animation duration: </label>
        <select id="durationSelect">
            <option value="1s">1 second</option>
            <option value="2s">2 seconds</option>
            <option value="3s">3 seconds</option>
        </select>
    </div>

    <script src="script.js"></script>
</body>
</html>
